name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Sync branch and tags from upstream
        run: |
          git remote add upstream https://github.com/decolua/9router.git
          git fetch upstream --tags
          git checkout master
          git merge upstream/master --no-edit
          git push origin master
          git push origin --tags

      - name: Mirror upstream GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          gh release list --repo decolua/9router --limit 20 | while IFS=$'\t' read -r title type tag date; do
            if ! gh release view "$tag" --repo ${{ github.repository }} >/dev/null 2>&1; then
              notes=$(gh release view "$tag" --repo decolua/9router --json body -q .body)
              gh release create "$tag" --repo ${{ github.repository }} --title "$title" --notes "$notes" || true
            fi
          done
